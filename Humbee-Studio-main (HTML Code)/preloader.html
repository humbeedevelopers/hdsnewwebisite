<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Loader</title>
        <style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: #ffffff;
        font-family: "Segoe UI", sans-serif;
    }

    .loader {
        width: 180px;
        height: 180px;
        border-radius: 50%;
        background: conic-gradient(
            from 0deg,
            #0033cc,
            #4d79ff,
            #aabfff,
            #ffffff 90%
        );
        animation: rotate 2s linear infinite;
    }

    @keyframes rotate {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
    }

    .percent {
        margin-top: 40px;
        font-size: 42px;
        font-weight: 300;
        color: #000;
    }

    .label {
        margin-top: 40px;
        font-size: 18px;
        letter-spacing: 1px;
        color: #666;
    }
</style>
    </head>
    <body>

        <div class="loader"></div>
        <div class="percent" id="percentText">0%</div>
        <div class="label">H/DS</div>

        <script>
let percent = 0;
const text = document.getElementById("percentText");

function update() {
    if (percent <= 100) {
        text.textContent = percent + "%";
        percent++;
        setTimeout(update, 25);
    }
}
update();
</script>
    </body>
</html>
